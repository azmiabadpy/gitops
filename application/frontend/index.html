<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitOps 2-Tier Application</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 80px auto;
      padding: 20px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 30px;
      text-align: left;
      padding: 20px;
      background: #f4f4f4;
      border-radius: 8px;
      min-height: 50px;
    }

    .error {
      color: red;
    }
  </style>
</head>

<body>

  <h1>GitOps 2-Tier Application</h1>

  <p>Frontend is running successfully.</p>

  <button onclick="getData()">Fetch Data From Backend</button>

  <div id="result">
    Click the button to fetch backend data.
  </div>

  <script>
    async function getData() {
      const result = document.getElementById("result");

      result.innerHTML = "Loading...";

      try {
        const response = await fetch("/api/data");

        if (!response.ok) {
          throw new Error(`Backend returned ${response.status}`);
        }

        const data = await response.json();

        result.innerHTML =
          `<pre>${JSON.stringify(data, null, 2)}</pre>`;

      } catch (error) {
        console.error("Backend connection error:", error);

        result.innerHTML =
          `<p class="error">Unable to connect to backend.</p>`;
      }
    }
  </script>

</body>
</html>
