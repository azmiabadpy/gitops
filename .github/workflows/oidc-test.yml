name: GitOps CI

on:
  push:
    branches:
      - main
      - gitops/helm

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  FRONTEND_REPOSITORY: gitops-frontend
  BACKEND_REPOSITORY: gitops-backend
  TF_IN_AUTOMATION: true

concurrency:
  group: gitops-terraform
  cancel-in-progress: false


jobs:

  # ============================================================
  # STAGE 1 - VERIFY GITHUB OIDC + AWS AUTHENTICATION
  # ============================================================

  oidc:
    name: Stage 1 - Verify AWS OIDC
    runs-on: ubuntu-latest

    steps:

      - name: Show GitHub OIDC Claims
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | python3 -c \
            'import sys,json; print(json.load(sys.stdin)["value"])')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          python3 - "$PAYLOAD" <<'PY'
          import sys
          import json
          import base64

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload.encode()).decode()
          )

          print("OIDC sub:", claims.get("sub"))
          print("OIDC aud:", claims.get("aud"))
          print("Repository:", claims.get("repository"))
          print("Ref:", claims.get("ref"))
          PY

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity


  # ============================================================
  # STAGE 2 - TERRAFORM VALIDATION
  # ============================================================

  terraform-validate:
    name: Stage 2 - Terraform Validate
    runs-on: ubuntu-latest
    needs: oidc

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate


  # ============================================================
  # STAGE 3 - TERRAFORM PLAN AND APPLY
  # ============================================================

  terraform-deploy:
    name: Stage 3 - Terraform Deploy
    runs-on: ubuntu-latest
    needs: terraform-validate

    env:
      TF_VAR_database_username: ${{ secrets.DB_USERNAME }}
      TF_VAR_database_password: ${{ secrets.DB_PASSWORD }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan


  # ============================================================
  # STAGE 4A - BUILD AND PUSH FRONTEND IMAGE
  # ============================================================

  build-frontend:
    name: Stage 4A - Build Frontend
    runs-on: ubuntu-latest
    needs: terraform-deploy

    outputs:
      image: ${{ steps.image-info.outputs.image }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Frontend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG" \
            ./application/frontend

      - name: Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"

      - name: Set Frontend Image Output
        id: image-info
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "image=$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"


  # ============================================================
  # STAGE 4B - BUILD AND PUSH BACKEND IMAGE
  # ============================================================

  build-backend:
    name: Stage 4B - Build Backend
    runs-on: ubuntu-latest
    needs: terraform-deploy

    outputs:
      image: ${{ steps.image-info.outputs.image }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Backend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG" \
            ./application/backend

      - name: Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"

      - name: Set Backend Image Output
        id: image-info
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "image=$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"


  # ============================================================
  # STAGE 5 - PIPELINE SUMMARY
  # ============================================================

  summary:
    name: Stage 5 - Pipeline Summary
    runs-on: ubuntu-latest

    needs:
      - build-frontend
      - build-backend

    steps:

      - name: Show Published Images
        run: |
          echo "=========================================="
          echo "GitOps CI Pipeline Completed Successfully"
          echo "=========================================="

          echo ""
          echo "Frontend Image:"
          echo "${{ needs.build-frontend.outputs.image }}"

          echo ""
          echo "Backend Image:"
          echo "${{ needs.build-backend.outputs.image }}"

          echo ""
          echo "Git Commit:"
          echo "${{ github.sha }}"